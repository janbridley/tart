[package]
name = "tart-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ignore = "0.4"
nucleo-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
tart-ai = { path = "../tart-ai" }
unicode-segmentation = "1"

[lints]
workspace = true
