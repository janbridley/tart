[package]
name = "tart-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-compat = "0.2.5"
async-openai = { version = "0.41.3", features = ["responses"] }
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
futures = "0.3.34"
ignore = "0.4"
nucleo-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1"
tart-agents = { path = "../tart-agents" }
unicode-segmentation = "1"

[lints]
workspace = true
