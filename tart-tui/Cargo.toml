[package]
name = "tart-tui"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "tart"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ignore = "0.4"
itertools = "0.15.0"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde.workspace = true
serde_json.workspace = true
tart-agents = { path = "../tart-agents" }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1"
unicodeit = "0.2.2"

[dev-dependencies]
# Test scratch directories; tempfile removes them on drop.
tempfile.workspace = true
flate2.workspace = true

[lints]
workspace = true
