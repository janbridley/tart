[package]
name = "tart-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ignore = "0.4"
itertools = "0.15.0"
nucleo-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
tart-agents = { path = "../tart-agents" }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1"

[dev-dependencies]
# Test scratch directories; tempfile removes them on drop.
tempfile = "3"

[lints]
workspace = true
