[package]
name = "tart-agents"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# rustls-no-provider keeps aws-lc-rs provider out of our dependency chain and speed up
# compiles. We directly depend on rustls to get the required components.
async-openai = { version = "0.42.3", default-features = false, features = ["responses", "rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "gzip", "brotli", "deflate"] }
url = "2"
iprfc = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures = "0.3.34"
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.31.4", default-features = false, features = ["fs", "signal"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
rs-trafilatura = "0.2.2"
dom_query = "0.24"
flate2.workspace = true
libc = "0.2.191"
tempfile.workspace = true
fixed = { version = "1.31.0", features = ["serde", "serde-str"] }

[target.'cfg(target_os = "macos")'.dependencies]
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest-blocking", "reqwest", "rustls-tls"] }
security-framework = "3.7"
tiny_http = "0.12"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
macro_rules_attribute = "0.2.3"

[lints]
workspace = true
