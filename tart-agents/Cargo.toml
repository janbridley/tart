[package]
name = "tart-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-compat = "0.2.5"
# rustls-no-provider keeps aws-lc-rs provider out of our dependency chain and speed up
# compiles. We directly depend on rustls to get the required components.
async-openai = { version = "0.41.3", default-features = false, features = ["responses", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures = "0.3.34"
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
# Just `killpg` and the `Pid` it takes, so the harness itself stays free of
# `unsafe`: signalling a group cannot violate memory safety, which nix encodes.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
# Test scratch files and directories; tempfile removes them on drop.
tempfile = "3"

[lints]
workspace = true
