[package]
name = "tart-agents"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
# rustls-no-provider keeps aws-lc-rs provider out of our dependency chain and speed up
# compiles. We directly depend on rustls to get the required components.
async-openai = { version = "0.42.3", default-features = false, features = ["responses", "rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
    "gzip",
    "brotli",
    "deflate",
] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.31.4", default-features = false, features = ["fs", "signal"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rs-trafilatura = "0.2.2"
dom_query = "0.24"
flate2 = "1.1.11"
libc = "0.2.191"
tempfile = "3.27.0"

[dev-dependencies]
macro_rules_attribute = "0.2.3"

[lints]
workspace = true
